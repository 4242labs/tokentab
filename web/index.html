<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relative hrefs (not /…) so icons resolve whether served at a domain
         root or mounted at a subpath (matches vite base './'). -->
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <title>TokenTab | 42labs</title>
    <meta
      name="description"
      content="What AI actually costs, across providers, projects and machines — flat-rate plans included rather than excluded."
    />
    <link rel="canonical" href="https://tokentab.42labs.io/" />

    <!-- og:image wants an absolute URL: a crawler resolves it against nothing.
         The card is rendered from the design system's own OG page and lives at
         THE-BRAND-CHEST/tokentab/og/ — re-copy it after a token or lockup move,
         never redraw it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tokentab.42labs.io/" />
    <meta property="og:site_name" content="42labs" />
    <meta property="og:title" content="TokenTab | 42labs" />
    <meta
      property="og:description"
      content="What AI actually costs, across providers, projects and machines — flat-rate plans included rather than excluded."
    />
    <meta property="og:image" content="https://tokentab.42labs.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TokenTab — split the fee, not the tokens" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TokenTab | 42labs" />
    <meta
      name="twitter:description"
      content="What AI actually costs, across providers, projects and machines — flat-rate plans included rather than excluded."
    />
    <meta name="twitter:image" content="https://tokentab.42labs.io/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
