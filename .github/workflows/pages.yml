name: Deploy demo to GitHub Pages

# Builds the dashboard in demo mode and publishes web/dist via the official
# Pages artifact/OIDC flow.
#
# The demo dataset is regenerated on every run (tools/make-demo.py, called by
# `npm run build:demo`) rather than committed: the presets are relative to
# "today", so a fixture baked in June would have the demo open on an empty
# billing cycle. The weekly schedule exists only to keep those dates current
# on a repo that is not being pushed to.
#
# Nothing real is published. The generator invents its own accounts, projects
# and machines and never reads a store — see tools/make-demo.py.
#
# This workflow is INERT until an operator enables Pages (Settings → Pages →
# Source: GitHub Actions) for this repository.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; queued runs for the same ref are skipped
# (in-progress ones are not cancelled, so a deploy never lands half-done).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build:demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
